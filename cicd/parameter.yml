
# fabric-cicd parameterisation for Noordkade Freight.
#
# Item definitions exported from NKF-Dev contain Dev GUIDs. On deploy, every
# occurrence below is replaced with the target environment's equivalent, so the
# same definition runs against the right lakehouse, warehouse and workspace.
#
# Dev is the source of truth and is never a deployment target.

find_replace:

  # Workspace: NKF-Dev -> NKF-Test / NKF-Prod
  - find_value: "7e236ae2-d6a3-453e-bcd5-fc54c4f753a5"
    replace_value:
      test: "6e368542-3852-4a02-9ed2-117c53d63afa"
      prod: "177064c9-bb7e-41bd-a29e-96325856b81d"

  # Lakehouse: lh_freight
  - find_value: "def56cdc-9ae7-40c1-8883-52bb154ce846"
    replace_value:
      test: "4d9fd63a-7d14-42e2-ba0d-db7db012bbc0"
      prod: "28f287aa-a84e-4165-88e1-de3fa7cdea33"

  # Warehouse: wh_freight
  - find_value: "eb4375c3-ecfa-4594-ab3f-dd931705f5ef"
    replace_value:
      test: "182b71e9-8a3f-44fa-93d3-199574b194d6"
      prod: "c2c8af4a-4127-4ba3-9f43-79904cddfc2e"
