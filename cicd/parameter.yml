# fabric-cicd parameterization.
# On deploy, every occurrence of the Dev GUID/string in item definitions is
# replaced with the target environment's value. This is how one notebook that
# references the Dev lakehouse deploys cleanly to Test and Prod.
#
# Find your GUIDs: workspace URL for workspace_id, item settings for item ids.

find_replace:
  # Dev lakehouse -> environment lakehouse (referenced by notebooks, pipelines)
  - find_value: "11111111-aaaa-1111-aaaa-111111111111"   # lh_freight (Dev)
    replace_value:
      test: "22222222-bbbb-2222-bbbb-222222222222"
      prod: "33333333-cccc-3333-cccc-333333333333"

  # Dev warehouse -> environment warehouse
  - find_value: "44444444-dddd-4444-dddd-444444444444"   # wh_freight (Dev)
    replace_value:
      test: "55555555-eeee-5555-eeee-555555555555"
      prod: "66666666-ffff-6666-ffff-666666666666"

  # Dev workspace id (appears inside pipeline connection references)
  - find_value: "77777777-1111-7777-1111-777777777777"
    replace_value:
      test: "00000000-0000-0000-0000-00000000TEST"
      prod: "00000000-0000-0000-0000-00000000PROD"

  # Alerting target: personal address in test, ops distribution list in prod
  - find_value: "gilbert@bluepeak.example"
    replace_value:
      test: "gilbert@bluepeak.example"
      prod: "ops-alerts@noordkade.example"
